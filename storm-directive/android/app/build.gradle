plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stormdirective.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stormdirective.game'
        minSdk 21
        targetSdk 34
        versionCode 398
        versionName '10.119'
    }

    // A fixed key, so every build (from any session) installs over the last one. The keystore file is in the
    // repo, but its password is not: it comes from the SPAWN_KS_PASS environment variable (set in the Claude
    // environment's settings). Without it, a release build stops with a clear error rather than signing with
    // a different key (which would force an uninstall and lose saves).
    signingConfigs {
        release {
            def ksPass = System.getenv('SPAWN_KS_PASS') ?: ''
            if (!ksPass) gradle.taskGraph.whenReady { g -> if (g.allTasks.any { it.name.toLowerCase().contains('release') }) throw new GradleException('SPAWN_KS_PASS is not set: add it to the environment settings (see CLAUDE.md, Ship checklist).') }
            storeFile file('../spawnprawn.keystore')
            storePassword ksPass
            keyAlias 'spawnprawn'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            // The game itself lives in storm-directive/web and is bundled as app assets.
            assets.srcDirs = ['../../web']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
