<title>Prawn Loadout Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a lab bench. Left, the rack: tabs of draggable chips (weapons, modifiers, branches). Right, the dish: a pannable mind map
   growing rightwards from the sperm, one column per depth (weapon > modifier or Lv 3 branch > fork > mastery). */
:root {
  --bg: #e9eef0; --panel: #ffffff; --panel2: #f3f6f7; --ink: #15232a; --dim: #5e717a; --line: #c8d4d8; --accent: #0b7f8c; --hi: #0b7f8c22;
  --g-delivery: #2563c9; --g-flight: #d9480f; --g-crowd: #8e3fb0; --g-tempo: #c2185b; --g-chemistry: #1f8f4e; --g-area: #a07400; --g-lifesteal: #c0392b;
  --t-phys: #5a6c7c; --t-fire: #d4168a; --t-ice: #3f8f1f; --t-shock: #a3850a; --t-arcane: #b5123f; --t-soul: #a37a00; --t-flame: #e04e10; --t-poison: #c2447f; --t-oxi: #9c6b16; --t-salt: #2a6fd6; --t-sab: #1f8f4e; --idea: #3b4a55; --idea-bg: #fbfcf8; --pass: #6b5bd6; --gate: #b7791f;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; --body: 'Atkinson Hyperlegible', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1416; --panel: #151e21; --panel2: #1b2629; --ink: #e3ecee; --dim: #8ea3a9; --line: #283539; --accent: #4fd1e0; --hi: #4fd1e033;
  --g-delivery: #6ea2ff; --g-flight: #ff8a4d; --g-crowd: #c98cff; --g-tempo: #ff6fa8; --g-chemistry: #5fd68f; --g-area: #f0c24a; --g-lifesteal: #ff7b6b;
  --t-phys: #dfe7f2; --t-fire: #ff5fc0; --t-ice: #8ee05a; --t-shock: #ffe94a; --t-arcane: #ff5a7e; --t-soul: #ffcf5a; --t-flame: #ff7a3a; --t-poison: #ff8ac0; --t-oxi: #e0a84a; --t-salt: #6fa6ff; --t-sab: #5fd68f; --idea: #c9d6dc; --idea-bg: #1a2226; --pass: #a99bff; --gate: #f0c060; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1416; --panel: #151e21; --panel2: #1b2629; --ink: #e3ecee; --dim: #8ea3a9; --line: #283539; --accent: #4fd1e0; --hi: #4fd1e033;
  --g-delivery: #6ea2ff; --g-flight: #ff8a4d; --g-crowd: #c98cff; --g-tempo: #ff6fa8; --g-chemistry: #5fd68f; --g-area: #f0c24a; --g-lifesteal: #ff7b6b;
  --t-phys: #dfe7f2; --t-fire: #ff5fc0; --t-ice: #8ee05a; --t-shock: #ffe94a; --t-arcane: #ff5a7e; --t-soul: #ffcf5a; --t-flame: #ff7a3a; --t-poison: #ff8ac0; --t-oxi: #e0a84a; --t-salt: #6fa6ff; --t-sab: #5fd68f; --idea: #c9d6dc; --idea-bg: #1a2226; --pass: #a99bff; --gate: #f0c060; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--body); display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { font: 800 22px/1 var(--display); margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--dim); font-size: 13px; }
header .ver { margin-left: auto; font: 500 11px var(--mono); color: var(--dim); }
.bench { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .bench { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 44vh; } .rack { order: 2; } }

/* rack */
.rack { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 10px 6px; font: 700 13px var(--display); color: var(--dim); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible, .chip:focus-visible, .node:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rackbody { overflow: auto; padding: 10px; flex: 1; min-height: 0; }
.rackbody input[type="search"] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); margin-bottom: 10px; }
.sec { margin: 0 0 12px; }
.sec h3 { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.sec h3 i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { --c: var(--accent); display: inline-flex; flex-direction: column; gap: 1px; padding: 5px 9px 5px 10px; border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px;
  background: var(--panel); cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y; max-width: 100%; text-align: left; }
.chip b { font: 700 13px/1.15 var(--display); }
.chip small { font-size: 11px; color: var(--dim); }
.chip .fits { font: 500 10px var(--mono); color: var(--dim); letter-spacing: .02em; }
.chip.dim { opacity: .38; }
.chip.held { background: var(--hi); border-color: var(--accent); }
.chip.held b::after { content: ' ✓'; color: var(--accent); }
.chip:active { cursor: grabbing; }
.hint { font-size: 12px; color: var(--dim); margin: 0 0 10px; }
details.wb { border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; margin-bottom: 8px; background: var(--panel2); }
details.wb summary { cursor: pointer; padding: 8px 0; font: 700 13px var(--display); list-style: none; display: flex; gap: 8px; align-items: center; }
details.wb summary::before { content: '▸'; color: var(--dim); font-size: 11px; }
details.wb[open] summary::before { content: '▾'; }
details.wb summary small { color: var(--dim); font-weight: 400; font-family: var(--body); }
details.wb .sec { margin: 6px 0 10px; }
details.wb.onmap { border-color: var(--accent); }

/* dish */
.dish { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.dishbar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dishbar label { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 6px; }
.dishbar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); max-width: 60vw; }
.btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); font: 700 12px var(--display); }
.btn:hover { border-color: var(--accent); }
.btn.danger { color: var(--g-lifesteal); }
.sp { flex: 1; }
.zoom { display: flex; gap: 4px; }
.zoom .btn { min-width: 32px; padding: 5px 6px; }
.map { flex: 1; overflow: auto; position: relative; min-height: 0; cursor: grab;
  background-image: radial-gradient(circle, var(--line) 1px, transparent 1.2px); background-size: 22px 22px; }
.map.panning { cursor: grabbing; }
.sizer { position: relative; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.stage svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.stage svg path { fill: none; stroke: var(--c); stroke-width: 2.2; opacity: .75; }
.node { --c: var(--accent); position: absolute; width: 212px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 10px 8px; cursor: pointer; }
.node.over { outline: 3px solid var(--accent); outline-offset: 2px; }
.node.bad { outline: 3px solid var(--g-lifesteal); outline-offset: 2px; }
.node.sel { border-color: var(--c); box-shadow: 0 0 0 2px var(--c) inset; }
.node .ey { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c); display: flex; gap: 6px; align-items: center; }
.node .ey i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.node b { font: 700 14.5px/1.15 var(--display); display: block; margin: 2px 0 2px; }
.node p { margin: 0; font-size: 11.5px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .pips { display: flex; gap: 4px; margin-top: 5px; align-items: center; }
.node .pips span { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.node .pips span.on { background: var(--c); }
.node .pips em { font: 500 10px var(--mono); color: var(--dim); font-style: normal; margin-left: 4px; }
.node.hintnode { border-style: dashed; background: transparent; color: var(--dim); cursor: default; }
.node.hintnode b { font-weight: 500; color: var(--dim); }
.node.root { width: 250px; border-width: 2px; padding-top: 6px; }
.sperm { width: 100%; height: 64px; display: block; margin-bottom: 2px; }
.sperm .tail { transform-origin: 42px 30px; animation: wig .7s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) { .sperm .tail { animation: none; } }
@keyframes wig { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
.types { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.types span { font: 500 10px var(--mono); padding: 1px 6px; border-radius: 10px; border: 1px solid var(--tc); color: var(--tc); }
.chip.blank { border-style: dashed; border-left-style: dashed; background: var(--idea-bg); --c: var(--idea); }
.node.edited { background: var(--idea-bg); border-style: double; border-width: 3px; padding-left: 9px; }
.node.edited input, .node.edited textarea { display: block; width: 100%; border: 0; background: transparent; padding: 0; margin: 0; resize: none; color: var(--ink); }
.node.edited input:focus, .node.edited textarea:focus { outline: none; background: var(--hi); border-radius: 3px; }
.node.edited .ct { font: 700 14.5px/1.15 var(--display); margin: 2px 0; }
.node.edited .cx { font: 11.5px/1.35 var(--body); color: var(--dim); overflow: hidden; min-height: 32px; }
.node.gate { border-style: dotted; border-width: 2px; }
.node.gate .ey::before { content: ''; width: 9px; height: 11px; border: 2px solid var(--gate); border-radius: 3px 3px 2px 2px; border-top-width: 4px; flex: none; }
.node.custom { border-style: dashed; background: var(--idea-bg); --c: var(--idea); cursor: text; }
.node.custom input, .node.custom textarea { display: block; width: 100%; border: 0; background: transparent; padding: 0; margin: 0; resize: none; color: var(--ink); }
.node.custom input:focus, .node.custom textarea:focus { outline: none; background: var(--hi); border-radius: 3px; }
.node.custom .cg { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.node.custom .ct { font: 700 14.5px/1.15 var(--display); margin: 2px 0; }
.node.custom .cx { font: 11.5px/1.35 var(--body); color: var(--dim); overflow: hidden; min-height: 32px; }
.node.custom input::placeholder, .node.custom textarea::placeholder { color: var(--dim); opacity: .7; }
.ghost { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 50; opacity: .93; transform: translate(-50%, -50%) rotate(-2deg); box-shadow: 0 8px 24px #0006; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 60; max-width: min(92vw, 520px); opacity: 0; transition: opacity .15s; }
.toast.show { opacity: 1; }

/* detail drawer */
.detail { border-top: 1px solid var(--line); padding: 10px 12px; max-height: 40%; overflow: auto; background: var(--panel2); display: flex; flex-direction: column; gap: 8px; }
.detail .ey { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.detail h2 { font: 700 17px/1.1 var(--display); margin: 0; }
.detail p { margin: 0; font-size: 13px; }
.detail .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.detail .row .lab { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); min-width: 92px; flex: none; }
.btn.opt { font-weight: 500; font-family: var(--body); max-width: 100%; white-space: normal; text-align: left; }
.btn.opt.on { border-color: var(--accent); background: var(--hi); font-weight: 700; }
.btn:disabled { opacity: .4; cursor: default; }
.btn .n { display: inline-block; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--bg); font: 700 10px/16px var(--mono); margin-left: 4px; }
.node.moving { opacity: .35; }
.node.custom .ty, .node.edited .ty { font: 500 10px var(--mono); color: var(--dim); margin-top: 3px; }
.node.custom .ty.unset { color: var(--g-lifesteal); }
.detail select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.slots { display: flex; gap: 4px; align-items: center; }
.slots span { width: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.slots span.on { background: var(--accent); }
</style>

<header>
  <h1>Prawn Loadout Planner</h1>
  <span class="sub">Drag from the rack onto the dish. Tap a chip to add it to the selected node instead.</span>
  <span class="ver" id="ver"></span>
</header>
<div class="bench">
  <section class="rack" aria-label="Rack">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="weapons" id="tab-weapons">Weapons</button>
      <button role="tab" aria-selected="false" data-tab="mods" id="tab-mods">Modifiers</button>
      <button role="tab" aria-selected="false" data-tab="branches" id="tab-branches">Branches</button>
      <button role="tab" aria-selected="false" data-tab="feats" id="tab-feats">Feats &amp; more</button>
    </div>
    <div class="rackbody" id="rack"></div>
  </section>
  <section class="dish" aria-label="Dish">
    <div class="dishbar">
      <label for="sample">Sperm <select id="sample"></select></label>
      <label><input type="checkbox" id="rules" checked> Game rules</label>
      <span class="sp"></span>
      <div class="zoom"><button class="btn" id="zout" title="Zoom out">−</button><button class="btn" id="zfit" title="Fit">Fit</button><button class="btn" id="zin" title="Zoom in">+</button></div>
      <button class="btn" id="copy">Copy build</button>
      <button class="btn" id="ideas">Copy ideas</button>
      <button class="btn" id="saveall" title="Writes your blocks to the planner's list and asks Claude to fold them into ideas.md">Save to ideas.md</button>
      <button class="btn danger" id="clear">Clear</button>
    </div>
    <div class="map" id="map"><div class="sizer" id="sizer"><div class="stage" id="stage"></div></div></div>
    <div class="detail" id="detail"></div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const D = /*DATA*/null;
const MAXW = 4, SLOTS = D.mmOpen.length, SLOT_AT = D.mmOpen;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WIDS = Object.keys(D.weapons), MIDS = Object.keys(D.mods);
const GORDER = ['delivery', 'flight', 'crowd', 'tempo', 'chemistry', 'area', 'lifesteal'];
const AK = { Projectile: 'proj', Spread: 'spread', Contact: 'contact', Burst: 'burst', Beam: 'beam', Pool: 'pool' };
const ATK_ORDER = ['Projectile', 'Spread', 'Contact', 'Burst', 'Beam', 'Pool'];
const ATK_SHORT = { proj: 'Proj', spread: 'Spread', contact: 'Contact', burst: 'Burst', beam: 'Beam', pool: 'Pool' };
const BUILTIN = ['melee', 'mines', 'dfa', 'ranged'];
const tname = t => (D.types[t] || {}).name || t;
const tvar = t => `var(--t-${D.types[t] ? t : 'phys'})`;
const gvar = g => `var(--g-${g})`;
const MAST_IDX = { A1: 2, A2: 3, B1: 4, B2: 5 }, MAST_TXT = { A1: 4, A2: 5, B1: 6, B2: 7 };
const IDEA_TYPES = ['Weapon', 'Lv 3 branch', 'Lv 6 branch', 'Lv 9 mastery', 'Modifier', 'Modifier fork', 'Modifier mastery', 'Switched at Birth', 'Feat', 'Feat fork', 'Sperm passive', 'Passive mastery', 'Gate', 'Sample', 'Enemy', 'Other'];
const FEAT_BY = {}; for (const f of D.feats) FEAT_BY[f.id] = f; const FEAT = id => FEAT_BY[id];
const PASS_BY = {}; for (const p of D.passives) PASS_BY[p.id] = p; const PASS = id => PASS_BY[id];
const FAM = f => ({ body: 'Body', trade: 'Trade-off', rare: 'Rare', rules: 'Rules', def: 'Defence', fire: 'Fire', 'type:any': 'Any damage type' }[f] || (f.startsWith('type:') ? tname({ force: 'phys', acid: 'fire', static: 'shock', mucus: 'ice', blood: 'arcane', soul: 'soul', fire: 'flame' }[f.slice(5)] || f.slice(5)) + ' type' : f));
const GATE_KINDS = new Set(['promise', 'wbranch', 'wmast', 'mbranch', 'mmast', 'ffork', 'pmast']); // (branches: a Feat, modifier or passive dropped here is only available once the branch is taken)
const gateCard = g => { // what a gate holds
  if (g.k === 'mod') { const m = M(g.id); return m && { name: m.name, desc: m.ranks[0], kindName: 'modifier', col: gvar(m.group) }; }
  if (g.k === 'feat') { const f = FEAT(g.id); return f && { name: f.name, desc: f.does, kindName: 'Feat', col: f.type ? tvar(f.type) : 'var(--accent)' }; }
  if (g.k === 'pass') { const p = PASS(g.id); return p && { name: p.name, desc: p.desc, kindName: 'sperm passive', col: 'var(--pass)' }; }
  return null;
};
const KIND_TYPE = { weapon: 'Weapon', promise: 'Lv 3 branch', wbranch: 'Lv 6 branch', wmast: 'Lv 9 mastery', mod: 'Modifier', mbranch: 'Modifier fork', mmast: 'Modifier mastery', sab: 'Switched at Birth', feat: 'Feat', ffork: 'Feat fork', pass: 'Sperm passive', pmast: 'Passive mastery', gate: 'Gate' };
const SAB_DESC = t => `Attacks switch to ${tname(t)} damage: 35% of them, then 70%, then a fork at level 3 (fully switched, or Blend: the new type plus an echo of the original). Takes the Chemistry slot.`;
$('#ver').textContent = 'data from v' + D.version;

// ---------------------------------------------------------------- state
let S = { sample: D.samples[0].id, rules: true, sel: null, zoom: 1, weapons: [], custom: [], over: {}, feats: [], pass: [], gates: [], seq: 1 };
let FOCUS = null;
try { const s = JSON.parse(localStorage.getItem('sp_planner_v1') || 'null'); if (s && s.weapons) S = Object.assign(S, s); if (!S.custom) S.custom = []; if (!S.over) S.over = {}; for (const k of ['feats', 'pass', 'gates']) if (!S[k]) S[k] = []; } catch (e) { }
const save = () => { try { localStorage.setItem('sp_planner_v1', JSON.stringify(S)); } catch (e) { } };
const sampleOf = () => D.samples.find(s => s.id === S.sample) || D.samples[0];
const W = id => D.weapons[id], M = id => D.mods[id];
const findW = u => S.weapons.find(w => w.u === u);
const selW = () => { const n = NODES[S.sel]; return n && n.w ? n.w : null; };

// ---------------------------------------------------------------- toast
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

// ---------------------------------------------------------------- rules: what a drop does
// Returns { ok, why, run } for a payload dropped on a tree node (or null node = the dish itself).
// With Game rules off, anything the strict plan refuses lands as a block (a card copy) under whatever it was dropped on.
function dropPlan(p, n) {
  const r = (p.k === 'weapon' && !S.rules && n && n.kind !== 'root' && !(n.kind === 'hint' && !n.w)) ? { ok: false } : dropStrict(p, n);
  if (r.ok || S.rules || !n || n.kind === 'hint' || p.k === 'blank') return r;
  const cb = cardBlock(p); if (!cb) return r;
  return { ok: true, free: true, run: () => {
    const c = Object.assign({ u: S.seq++, parent: n.id, card: true }, cb); c.cardText = c.text; S.custom.push(c);
    if (p.k === 'move') { const sn = NODES[p.id]; if (sn && sn.kind === 'mod') { const from = sn.w, m = sn.m; from.mods = from.mods.filter(x => x !== m);
      for (const pre of ['m', 'mb', 'mm']) { const a = pre + from.u + '_' + m.id; for (const x of S.custom) if (x.parent === a) x.parent = 'c' + c.u; delete S.over[a]; } } }
    S.sel = 'c' + c.u; } };
}
function cardBlock(p) { // what a game card looks like as a free block
  if (p.k === 'weapon') { const w = W(p.id); return { tag: 'Weapon card', name: w.name, text: w.desc, type: 'Weapon', of: w.name }; }

const COLW = 212, ROOTW = 250, GX = 54, GY = 12, PAD = 24;
let LAST = null;

    const el = document.createElement('div');
    el.className = 'node ' + n.kind + (n.kind === 'root' ? ' root' : '') + (n.kind === 'hint' ? ' hintnode' : '') + (n.ov ? ' edited' : '') + (S.sel === n.id ? ' sel' : '');

}
function layout() {
  const stage = $('#stage'), { root, all } = LAST;

  for (const t of stage.querySelectorAll('textarea')) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
  const sub = n => { n.h = n.el.offsetHeight; let s = 0; for (const c of n.children) s += sub(c) + GY; n.sh = Math.max(n.h, s - GY); return n.sh; };

    n.x = xAt(n.depth); n.y = top + (n.sh - n.h) / 2; n.wd = n.depth ? COLW : ROOTW; maxX = Math.max(maxX, n.x + n.wd);
