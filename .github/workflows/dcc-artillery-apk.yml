name: DCC Artillery APK

on:
  push:
    paths:
      - "dcc-artillery/**"
      - ".github/workflows/dcc-artillery-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dcc-artillery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: dcc-artillery-debug-apk
          path: dcc-artillery/app/build/outputs/apk/debug/app-debug.apk
