name: Cryptid Clash APK

on:
  push:
    paths:
      - "cryptid-clash/**"
      - ".github/workflows/cryptid-clash-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptid-clash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: cryptid-clash-debug-apk
          path: cryptid-clash/app/build/outputs/apk/debug/app-debug.apk
