name: Clay Worms APK

on:
  push:
    paths:
      - "clay-worms/**"
      - ".github/workflows/clay-worms-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clay-worms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: clay-worms-debug-apk
          path: clay-worms/app/build/outputs/apk/debug/app-debug.apk
